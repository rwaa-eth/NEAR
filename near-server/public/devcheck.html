<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev check · RaOpenwallet</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a140f;
      --muted: #6b5b4c;
      --sand: #f6efe4;
      --sand-2: #efe4d4;
      --panel: rgba(255, 250, 243, 0.78);
      --line: rgba(26, 20, 15, 0.08);
      --amber: #e08a2b;
      --amber-deep: #c56a12;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(74, 42, 12, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(224, 138, 43, 0.28), transparent 55%),
        linear-gradient(180deg, #fbf6ee 0%, var(--sand) 42%, var(--sand-2) 100%);
      background-attachment: fixed;
    }
    .page { width: min(28rem, calc(100% - 1.5rem)); margin: 0 auto; padding: 1rem 0 3rem; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 1.35rem;
      color: inherit;
      text-decoration: none;
    }
    .brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .brand h1 {
      margin: 0;
      font-family: Syne, Manrope, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1.6rem;
      box-shadow: var(--shadow);
      padding: 1.15rem 1.15rem 1.25rem;
    }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.45; }
    label { display: block; margin-top: 0.95rem; font-size: 0.84rem; font-weight: 600; color: var(--muted); }
    label[hidden], form[hidden], .balances[hidden], .section[hidden] { display: none !important; }
    input {
      display: block;
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.85rem 0.9rem;
      border-radius: 0.9rem;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      color: var(--ink);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1rem; }
    button {
      font: inherit;
      font-weight: 700;
      padding: 0.85rem 1.15rem;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber-deep) 100%);
      color: #fff;
    }
    .balances { display: grid; gap: 0.75rem; margin: 1rem 0 0.25rem; }
    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .balance-row span {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .balance-row strong {
      font-family: Syne, Manrope, sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .section {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
    }
    .section h2 {
      margin: 0 0 0.55rem;
      font-family: Syne, Manrope, sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }
    .muted { color: var(--muted); line-height: 1.4; }
    .section .muted { margin: 0 0 0.55rem; font-size: 0.9rem; }
    ul { margin: 0; padding-left: 1.1rem; }
    li { margin: 0.4rem 0; line-height: 1.35; }
    #status { min-height: 1.2rem; margin: 0.9rem 0 0; color: var(--muted); }
    #status.bad { color: var(--danger); }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="/">
      <img src="/ragraphic.jpg" width="38" height="38" alt="">
      <h1>RaOpenwallet</h1>
    </a>
    <section class="panel">
      <p>Look up a wallet's balances and payments waiting to be collected.</p>
      <form id="password-form">
        <label>Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button class="primary" type="submit">Continue</button>
        </div>
      </form>
      <form id="check-form" hidden>
        <label>Email
          <input id="email" type="email" autocomplete="off" placeholder="you@example.com" required>
        </label>
        <div class="actions">
          <button class="primary" type="submit">Check</button>
        </div>
      </form>
      <div id="balances" class="balances" hidden>
        <div class="balance-row"><span>NEAR</span><strong id="near">—</strong></div>
        <div class="balance-row"><span id="token-label">USDT</span><strong id="token">—</strong></div>
      </div>
      <div id="collect-section" class="section" hidden>
        <h2>To collect</h2>
        <p class="muted">Held until you collect them into this wallet.</p>
        <ul id="incoming"></ul>
      </div>
      <p id="status" role="status"></p>
    </section>
  </div>
  <script>
    const passwordForm = document.querySelector("#password-form");
    const checkForm = document.querySelector("#check-form");
    const passwordInput = document.querySelector("#password");
    const emailInput = document.querySelector("#email");
    const balances = document.querySelector("#balances");
    const nearEl = document.querySelector("#near");
    const tokenEl = document.querySelector("#token");
    const tokenLabel = document.querySelector("#token-label");
    const collectSection = document.querySelector("#collect-section");
    const incomingList = document.querySelector("#incoming");
    const statusEl = document.querySelector("#status");
    let password = "";

    function formatAmount(amount, decimals, maxDp = decimals) {
      const digits = String(amount).replace(/^-/, "").replace(/\D/g, "").padStart(decimals + 1, "0");
      let whole = digits.slice(0, -decimals) || "0";
      let frac = digits.slice(-decimals);
      const places = Math.min(maxDp, frac.length);
      const keep = frac.slice(0, places);
      const roundUp = places < frac.length && frac[places] >= "5";
      if (roundUp) {
        const bumped = BigInt(whole) * 10n ** BigInt(places) + BigInt(keep || "0") + 1n;
        const text = bumped.toString().padStart(places + 1, "0");
        whole = text.slice(0, -places);
        frac = text.slice(-places);
      } else {
        frac = keep;
      }
      frac = frac.replace(/0+$/, "");
      return frac ? `${whole}.${frac}` : whole;
    }

    passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      statusEl.classList.remove("bad");
      const response = await fetch("/devcheck", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: passwordInput.value }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        statusEl.classList.add("bad");
        statusEl.textContent = body.error || "Wrong password.";
        return;
      }
      password = passwordInput.value;
      passwordForm.hidden = true;
      checkForm.hidden = false;
      emailInput.focus();
    });

    checkForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      statusEl.classList.remove("bad");
      balances.hidden = true;
      collectSection.hidden = true;
      const response = await fetch("/devcheck", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password, email: emailInput.value }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        statusEl.classList.add("bad");
        statusEl.textContent = body.error || "Could not check that email.";
        return;
      }
      tokenLabel.textContent = body.symbol || "USDT";
      nearEl.textContent = body.near === null ? "—" : formatAmount(body.near, 24, 3);
      tokenEl.textContent = body.token === null ? "—" : formatAmount(body.token, body.decimals, 2);
      balances.hidden = false;
      incomingList.replaceChildren();
      const incoming = body.incoming || [];
      for (const row of incoming) {
        const item = document.createElement("li");
        const from = row.senderEmail || row.senderAddress;
        item.textContent = `${formatAmount(row.amount, body.decimals)} ${body.symbol} from ${from}`;
        incomingList.append(item);
      }
      collectSection.hidden = incoming.length === 0;
      const notes = [];
      if (!body.registered) notes.push("That email has no wallet yet.");
      if (incoming.length === 0) notes.push("No payments to collect.");
      statusEl.textContent = notes.join(" ");
    });
  </script>
</body>
</html>
