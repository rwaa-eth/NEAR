<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invite · RaOpenwallet</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a140f;
      --muted: #6b5b4c;
      --sand: #f6efe4;
      --sand-2: #efe4d4;
      --panel: rgba(255, 250, 243, 0.78);
      --line: rgba(26, 20, 15, 0.08);
      --amber: #e08a2b;
      --amber-deep: #c56a12;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(74, 42, 12, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(224, 138, 43, 0.28), transparent 55%),
        linear-gradient(180deg, #fbf6ee 0%, var(--sand) 42%, var(--sand-2) 100%);
      background-attachment: fixed;
    }
    .page { width: min(28rem, calc(100% - 1.5rem)); margin: 0 auto; padding: 1rem 0 3rem; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 1.35rem;
      color: inherit;
      text-decoration: none;
    }
    .brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .brand h1 {
      margin: 0;
      font-family: Syne, Manrope, sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1.6rem;
      box-shadow: var(--shadow);
      padding: 1.15rem 1.15rem 1.25rem;
    }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.45; }
    label { display: block; margin-top: 0.95rem; font-size: 0.84rem; font-weight: 600; color: var(--muted); }
    label[hidden] { display: none !important; }
    input {
      display: block;
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.85rem 0.9rem;
      border-radius: 0.9rem;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      color: var(--ink);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1rem; }
    button {
      font: inherit;
      font-weight: 700;
      padding: 0.85rem 1.15rem;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    button[hidden] { display: none !important; }
    .primary {
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber-deep) 100%);
      color: #fff;
    }
    .ghost { background: rgba(255, 255, 255, 0.7); border-color: var(--line); color: var(--ink); }
    .code {
      margin: 0.4rem 0 0;
      font-family: Syne, Manrope, sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.18em;
      word-break: break-all;
    }
    #status { min-height: 1.2rem; margin: 0.9rem 0 0; color: var(--danger); }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="/">
      <img src="/ragraphic.jpg" width="38" height="38" alt="">
      <h1>RaOpenwallet</h1>
    </a>
    <section class="panel">
      <p>Enter the invite password to create one signup code.</p>
      <form id="invite-form">
        <label id="password-field">Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button id="create" class="primary" type="submit">Create code</button>
          <button id="copy" class="ghost" type="button" hidden>Copy code</button>
        </div>
      </form>
      <p id="code" class="code" hidden></p>
      <p id="status" role="status"></p>
    </section>
  </div>
  <script>
    const form = document.querySelector("#invite-form");
    const passwordInput = document.querySelector("#password");
    const copyButton = document.querySelector("#copy");
    const codeEl = document.querySelector("#code");
    const statusEl = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      const response = await fetch("/invite", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: passwordInput.value }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        statusEl.textContent = body.error || "Could not create a code.";
        return;
      }
      codeEl.hidden = false;
      codeEl.textContent = body.code;
      copyButton.hidden = false;
      statusEl.textContent = "Give this code to one new account.";
    });

    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(codeEl.textContent);
      statusEl.textContent = "Copied.";
    });
  </script>
</body>
</html>
