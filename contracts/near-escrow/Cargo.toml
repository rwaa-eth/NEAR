[package]
name = "near-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Holds a NEAR fungible token for an email hash until it is released or reclaimed."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
